<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multicerebro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4361ee">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Multicerebro">
<style>
  :root {
    --bg: #fff8e7; --card: #ffffff; --ink: #2b2d42; --muted: #6c7089;
    --primary: #4361ee; --good: #2a9d8f; --bad: #e76f51; --accent: #ffb703;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    display: flex; justify-content: center; padding: 16px;
  }
  main { width: 100%; max-width: 560px; }
  h1 { text-align: center; margin: 8px 0 16px; font-size: 1.8rem; }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,.08); margin-bottom: 16px;
  }
  .hidden { display: none !important; }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 12px;
    padding: 12px 18px; background: var(--primary); color: #fff; font-weight: bold;
    transition: transform .08s, filter .15s;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.96); }
  button.secondary { background: #e9ecff; color: var(--primary); }
  button.ghost { background: transparent; color: var(--muted); font-weight: normal; text-decoration: underline; padding: 6px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input[type=text], input[type=number] {
    font: inherit; padding: 12px; border-radius: 12px; border: 2px solid #d8dcf0; width: 100%;
  }
  label { font-weight: bold; display: block; margin-bottom: 6px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; }
  .players { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
  .players button { flex: 1 1 40%; font-size: 1.1rem; }
  .tables { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; margin: 10px 0; }
  .tables label {
    margin: 0; text-align: center; background: #f1f3ff; border-radius: 12px;
    padding: 10px 0; cursor: pointer; border: 2px solid transparent; user-select: none;
  }
  .tables input { display: none; }
  .tables input:checked + span { color: #fff; }
  .tables label:has(input:checked) { background: var(--primary); color: #fff; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .score { background: var(--accent); color: #3a2a00; border-radius: 999px; padding: 6px 14px; font-weight: bold; }
  .question { font-size: 3rem; text-align: center; margin: 18px 0; font-weight: bold; letter-spacing: 2px; }
  .answer-row { display: flex; gap: 10px; }
  .answer-row input { font-size: 1.6rem; text-align: center; }
  .options { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; justify-content: center; }
  .options button { font-size: 1.5rem; min-width: 72px; background: #e9ecff; color: var(--primary); }
  .help { display: flex; gap: 10px; margin-top: 14px; }
  .help button { flex: 1; }
  .feedback { text-align: center; font-size: 1.3rem; font-weight: bold; min-height: 2.4em; margin-top: 14px; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .hint { color: var(--muted); font-size: .9rem; text-align: center; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { padding: 8px 4px; text-align: center; border-bottom: 1px solid #eceefb; }
  th:first-child, td:first-child { text-align: left; }
  td.total { font-weight: bold; color: var(--primary); }
  .today { background: #fff3c4; }
  select { font: inherit; padding: 10px; border-radius: 12px; border: 2px solid #d8dcf0; width: 100%; margin-bottom: 10px; background: #fff; }
  .story-title { margin: 4px 0 6px; color: var(--primary); }
  .story-text { font-size: 1.1rem; line-height: 1.5; margin: 0 0 8px; }
  .daily-h { margin: 0 0 6px; }
  .riddle-q { font-size: 1.15rem; font-weight: bold; margin: 6px 0 12px; }
  .badge { background: var(--accent); color: #3a2a00; border-radius: 999px; padding: 2px 10px; font-size: .85rem; vertical-align: middle; }
  .pop { animation: pop .35s; }
  @keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<main>
  <h1>🧠 Multicerebro</h1>

  <!-- Pantalla 1: elegir jugador -->
  <section id="screen-home" class="card">
    <label>¿Quién va a jugar?</label>
    <div id="players" class="players"></div>
    <div class="row">
      <input type="text" id="new-name" placeholder="Nombre nuevo" maxlength="20">
      <button id="btn-add" style="flex:0 0 auto">Agregar</button>
    </div>
    <div style="margin-top:16px; text-align:center">
      <button class="secondary" id="btn-report">📊 Ver puntos de la semana</button>
    </div>
    <div id="install-box" class="hidden" style="margin-top:16px; text-align:center">
      <button id="btn-install" class="hidden" style="background:var(--good)">📲 Instalar en el celular</button>
      <p id="ios-help" class="hint hidden">Para instalarla: tocá el botón <strong>Compartir</strong> <span aria-hidden="true">⬆️</span> de Safari y elegí <strong>“Agregar a pantalla de inicio”</strong>.</p>
    </div>
  </section>

  <!-- Historia y acertijo del día (se muestran junto a la pantalla de inicio) -->
  <section id="screen-daily" class="card">
    <h2 class="daily-h">📖 Historia del día</h2>
    <h3 class="story-title" id="story-title"></h3>
    <p class="story-text" id="story-text"></p>
    <hr style="border:none; border-top:2px dashed #e3e6f7; margin:16px 0">
    <label for="riddle-player">¿Quién responde hoy?</label>
    <select id="riddle-player"></select>
    <h2 class="daily-h">🧩 Acertijo del día <span class="badge">+2 puntos</span></h2>
    <p class="riddle-q" id="riddle-q"></p>
    <form id="riddle-form" class="answer-row" autocomplete="off">
      <input type="number" id="riddle-answer" inputmode="numeric" placeholder="?" required>
      <button type="submit" id="riddle-btn" style="flex:0 0 auto">Responder</button>
    </form>
    <div class="feedback" id="riddle-fb"></div>
    <hr style="border:none; border-top:2px dashed #e3e6f7; margin:16px 0">
    <h2 class="daily-h">🔢 ¿Qué número soy? <span class="badge">+1 punto</span></h2>
    <p class="riddle-q" id="adivi-q"></p>
    <form id="adivi-form" class="answer-row" autocomplete="off">
      <input type="number" id="adivi-answer" inputmode="numeric" placeholder="?" required>
      <button type="submit" id="adivi-btn" style="flex:0 0 auto">Responder</button>
    </form>
    <div class="feedback" id="adivi-fb"></div>
  </section>

  <!-- Pantalla 2: configurar partida -->
  <section id="screen-setup" class="card hidden">
    <div class="topbar">
      <strong id="setup-name"></strong>
      <button class="ghost" data-back>← Cambiar jugador</button>
    </div>
    <label>¿Qué tablas querés practicar?</label>
    <div class="row" style="margin-bottom:10px">
      <button class="secondary" id="mode-all">⭐ TODAS<br><small>suman puntos</small></button>
      <button class="secondary" id="mode-pick">🎯 Elegir tablas<br><small>práctica, sin puntos</small></button>
    </div>
    <div id="pick-box" class="hidden">
      <div id="tables" class="tables"></div>
    </div>
    <label for="num-q">Cantidad de preguntas</label>
    <input type="number" id="num-q" value="10" min="5" max="50">
    <p class="hint" id="mode-hint"></p>
    <button id="btn-start" style="width:100%; margin-top:8px; font-size:1.2rem">¡Empezar!</button>
  </section>

  <!-- Pantalla 3: juego -->
  <section id="screen-game" class="card hidden">
    <div class="topbar">
      <span id="progress"></span>
      <span class="score">⭐ <span id="session-score">0</span></span>
    </div>
    <div class="question" id="question"></div>
    <form id="answer-form" class="answer-row" autocomplete="off">
      <input type="number" id="answer" inputmode="numeric" placeholder="?" required>
      <button type="submit" style="flex:0 0 auto">Responder</button>
    </form>
    <div class="help">
      <button type="button" class="secondary" id="opt5">💡 Ver 5 opciones</button>
    </div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div style="text-align:center"><button class="ghost" id="btn-quit">Terminar ahora</button></div>
  </section>

  <!-- Pantalla 4: resultado -->
  <section id="screen-result" class="card hidden" style="text-align:center">
    <h2>¡Terminaste! 🎉</h2>
    <p style="font-size:1.2rem">Aciertos: <strong id="res-correct"></strong> de <strong id="res-total"></strong></p>
    <p style="font-size:2rem" class="pop">⭐ <strong id="res-points"></strong> puntos</p>
    <p class="hint" id="res-week"></p>
    <div class="row" style="margin-top:16px">
      <button id="btn-again">Jugar de nuevo</button>
      <button class="secondary" data-back>Inicio</button>
    </div>
  </section>

  <!-- Pantalla 5: reporte semanal -->
  <section id="screen-report" class="card hidden">
    <div class="topbar">
      <strong>Puntos de la semana</strong>
      <button class="ghost" data-back>← Volver</button>
    </div>
    <p class="hint" id="report-range" style="text-align:left"></p>
    <div style="overflow-x:auto"><table id="report-table"></table></div>
    <div class="row" style="margin-top:16px">
      <button class="secondary" id="btn-prev-week">← Semana anterior</button>
      <button class="secondary" id="btn-next-week">Semana siguiente →</button>
    </div>
    <div style="text-align:center; margin-top:14px">
      <button class="ghost" id="btn-reset">Borrar todos los datos</button>
    </div>
  </section>
</main>

<script>
(function () {
  'use strict';

  /* ---------- Almacenamiento: cookie local (con respaldo en localStorage) ---------- */
  const KEY = 'tablas_v1';
  const emptyData = () => ({ players: {}, riddles: {}, adivi: {} }); // players[nombre] = { 'YYYY-MM-DD': puntos }

  function readCookie() {
    const m = document.cookie.split('; ').find(c => c.startsWith(KEY + '='));
    if (!m) return null;
    try { return JSON.parse(decodeURIComponent(m.slice(KEY.length + 1))); } catch (e) { return null; }
  }
  function writeCookie(data) {
    const exp = new Date(); exp.setFullYear(exp.getFullYear() + 2);
    document.cookie = KEY + '=' + encodeURIComponent(JSON.stringify(data)) +
      '; expires=' + exp.toUTCString() + '; path=/; SameSite=Lax';
  }
  function load() {
    let d = readCookie();
    if (!d) { try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) { d = null; } }
    if (!d || !d.players) return emptyData();
    d.riddles = d.riddles || {};
    d.adivi = d.adivi || {};
    return d;
  }
  function save() {
    // Las cookies tienen tope de ~4 KB: guardamos solo los últimos 60 días por jugador en la cookie
    writeCookie(trimmed(data, 60));
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }
  function trimmed(d, days) {
    const limit = ymd(addDays(new Date(), -days));
    const out = { players: {}, riddles: {}, adivi: {} };
    for (const k of ['riddles', 'adivi'])
      for (const [day, byName] of Object.entries(d[k] || {})) if (day >= limit) out[k][day] = byName;
    for (const [name, byDay] of Object.entries(d.players)) {
      out.players[name] = {};
      for (const [day, pts] of Object.entries(byDay)) if (day >= limit) out.players[name][day] = pts;
    }
    return out;
  }

  let data = load();

  /* ---------- Fechas ---------- */
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  function mondayOf(d) { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  const DIAS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

  function addPoints(name, pts) {
    const day = ymd(new Date());
    data.players[name][day] = (data.players[name][day] || 0) + pts;
    save();
  }
  function weekTotal(name, monday) {
    let t = 0;
    for (let i = 0; i < 7; i++) t += data.players[name][ymd(addDays(monday, i))] || 0;
    return t;
  }

  /* ---------- Utilidades de UI ---------- */
  const $ = id => document.getElementById(id);
  const screens = ['home', 'setup', 'game', 'result', 'report'];
  function show(name) {
    screens.forEach(s => $('screen-' + s).classList.toggle('hidden', s !== name));
    $('screen-daily').classList.toggle('hidden', name !== 'home');
  }
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const rand = n => Math.floor(Math.random() * n);
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  /* ---------- Jugadores ---------- */
  let player = null;
  function renderPlayers() {
    const box = $('players');
    const names = Object.keys(data.players);
    box.innerHTML = names.length ? '' : '<p class="hint">Agregá un nombre para empezar 👇</p>';
    names.forEach(n => {
      const b = document.createElement('button');
      b.textContent = '🧒 ' + n;
      b.onclick = () => { player = n; $('setup-name').textContent = '¡Hola, ' + n + '!'; show('setup'); };
      box.appendChild(b);
    });
    if (typeof renderDaily === 'function') renderDaily();
  }
  function addPlayer() {
    const name = $('new-name').value.trim();
    if (!name) return;
    if (!data.players[name]) { data.players[name] = {}; save(); }
    $('new-name').value = '';
    renderPlayers();
  }
  $('btn-add').onclick = addPlayer;
  $('new-name').addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });
  document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { renderPlayers(); show('home'); });

  /* ---------- Configuración ---------- */
  const tablesBox = $('tables');
  for (let i = 1; i <= 12; i++) {
    const l = document.createElement('label');
    l.innerHTML = '<input type="checkbox" value="' + i + '"' +  + '><span>' + i + '</span>';
    tablesBox.appendChild(l);
  }
  let scoring = true; // true = modo TODAS (suma puntos); false = práctica
  function setMode(all) {
    scoring = all;
    $('mode-all').style.outline = all ? '3px solid var(--primary)' : 'none';
    $('mode-pick').style.outline = all ? 'none' : '3px solid var(--primary)';
    $('pick-box').classList.toggle('hidden', all);
    $('mode-hint').textContent = all
      ? 'Sin ayuda = 3 puntos · Con las 5 opciones = 1 punto'
      : 'Modo práctica: en este modo NO se suman puntos. Para sumar, elegí TODAS.';
  }
  $('mode-all').onclick = () => setMode(true);
  $('mode-pick').onclick = () => setMode(false);
  setMode(true);

  /* ---------- Juego ---------- */
  let cfg = {}, game = null;

  // Mazo de operaciones sin repetir (3×4 y 4×3 cuentan como la misma).
  // Solo si se piden más preguntas que operaciones distintas, se vuelve a mezclar.
  function buildDeck() {
    const seen = new Set(), deck = [];
    cfg.tables.forEach(a => {
      for (let b = 1; b <= 12; b++) {
        const key = Math.min(a, b) + 'x' + Math.max(a, b);
        if (!seen.has(key)) { seen.add(key); deck.push([a, b]); }
      }
    });
    return shuffle(deck);
  }
  function newQuestion() {
    if (!game.deck.length) {
      const last = game.last;
      game.deck = buildDeck();
      // evita que la primera de la nueva vuelta sea igual a la última jugada
      if (game.deck.length > 1 && game.deck[game.deck.length - 1].join('x') === last) game.deck.unshift(game.deck.pop());
    }
    let [a, b] = game.deck.pop();
    if (rand(2)) [a, b] = [b, a]; // a veces se muestra al revés (4×3 en vez de 3×4)
    game.last = a + 'x' + b;
    return { a, b, ans: a * b, usedOptions: false, answered: false };
  }

  function startGame() {
    const tables = scoring
      ? Array.from({ length: 12 }, (_, i) => i + 1)
      : [...tablesBox.querySelectorAll('input:checked')].map(i => +i.value);
    if (!tables.length) { alert('Elegí al menos una tabla'); return; }
    const n = Math.max(5, Math.min(50, +$('num-q').value || 10));
    cfg = { tables, n, scoring };
    game = { i: 0, correct: 0, points: 0, last: '', q: null, deck: [] };
    show('game');
    nextQuestion();
  }

  function nextQuestion() {
    if (game.i >= cfg.n) return finish();
    game.i++;
    game.q = newQuestion();
    $('progress').textContent = 'Pregunta ' + game.i + ' de ' + cfg.n;
    $('session-score').textContent = game.points;
    $('question').textContent = game.q.a + ' × ' + game.q.b + ' = ?';
    $('answer').value = '';
    $('options').innerHTML = '';
    setFeedback('', '');
    setInputEnabled(true);
    $('answer').focus();
  }

  function setInputEnabled(on) {
    $('answer').disabled = !on;
    $('answer-form').querySelector('button').disabled = !on;
    $('opt5').disabled = !on || game.q.usedOptions;
  }
  function setFeedback(text, cls) { const f = $('feedback'); f.textContent = text; f.className = 'feedback ' + cls; }

  function makeOptions(count) {
    const q = game.q;
    q.usedOptions = true;
    const set = new Set([q.ans]);
    // Distractores creíbles: resultados de tablas vecinas y números cercanos
    const cands = shuffle([q.a * (q.b + 1), q.a * (q.b - 1), (q.a + 1) * q.b, (q.a - 1) * q.b,
                           q.ans + 10, q.ans - 10, q.ans + 1, q.ans - 1, q.ans + 2, q.ans - 2]);
    for (const c of cands) { if (set.size >= count) break; if (c > 0) set.add(c); }
    let extra = 3; while (set.size < count) set.add(q.ans + (extra++));
    const box = $('options'); box.innerHTML = '';
    shuffle([...set]).forEach(v => {
      const b = document.createElement('button');
      b.textContent = v;
      b.onclick = () => resolve(v);
      box.appendChild(b);
    });
    $('opt5').disabled = true;
  }
  $('opt5').onclick = () => makeOptions(5);

  $('answer-form').addEventListener('submit', e => {
    e.preventDefault();
    if (game.q.answered || $('answer').value === '') return;
    resolve(+$('answer').value);
  });

  function resolve(value) {
    const q = game.q;
    if (q.answered) return;
    q.answered = true;
    setInputEnabled(false);
    document.querySelectorAll('#options button').forEach(b => b.disabled = true);
    if (value === q.ans) {
      game.correct++;
      if (cfg.scoring) {
        const pts = q.usedOptions ? 1 : 3;
        game.points += pts;
        addPoints(player, pts);
        setFeedback('¡Correcto! +' + pts + (pts === 1 ? ' punto' : ' puntos') + ' 🎉', 'good');
      } else {
        setFeedback('¡Correcto! 🎉 (práctica, sin puntos)', 'good');
      }
    } else {
      setFeedback('Casi… ' + q.a + ' × ' + q.b + ' = ' + q.ans, 'bad');
    }
    $('session-score').textContent = game.points;
    setTimeout(nextQuestion, value === q.ans ? 1100 : 2200);
  }

  function finish() {
    show('result');
    $('res-correct').textContent = game.correct;
    $('res-total').textContent = cfg.n;
    $('res-points').textContent = game.points;
    $('res-week').textContent = cfg.scoring
      ? 'Total de la semana: ' + weekTotal(player, mondayOf(new Date())) + ' puntos'
      : 'Fue práctica: no se sumaron puntos. Para sumar, jugá con TODAS.';
  }

  $('btn-start').onclick = startGame;
  $('btn-again').onclick = () => show('setup');
  $('btn-quit').onclick = () => { if (confirm('¿Terminar ahora?')) { game.i = cfg.n; if (game.q) game.q.answered = true; finish(); } };

  /* ---------- Reporte semanal ---------- */
  let reportMonday = mondayOf(new Date());
  function renderReport() {
    const todayKey = ymd(new Date());
    const end = addDays(reportMonday, 6);
    $('report-range').textContent = 'Del ' + reportMonday.getDate() + '/' + (reportMonday.getMonth() + 1) +
      ' al ' + end.getDate() + '/' + (end.getMonth() + 1);
    const names = Object.keys(data.players);
    if (!names.length) { $('report-table').innerHTML = '<tr><td>Todavía no hay jugadores.</td></tr>'; return; }
    let html = '<tr><th>Nombre</th>' + DIAS.map((d, i) =>
      '<th class="' + (ymd(addDays(reportMonday, i)) === todayKey ? 'today' : '') + '">' + d + '</th>').join('') + '<th>Total</th></tr>';
    names.forEach(n => {
      html += '<tr><td>' + esc(n) + '</td>';
      for (let i = 0; i < 7; i++) {
        const k = ymd(addDays(reportMonday, i));
        html += '<td class="' + (k === todayKey ? 'today' : '') + '">' + (data.players[n][k] || 0) + '</td>';
      }
      html += '<td class="total">' + weekTotal(n, reportMonday) + '</td></tr>';
    });
    $('report-table').innerHTML = html;
  }
  $('btn-report').onclick = () => { reportMonday = mondayOf(new Date()); renderReport(); show('report'); };
  $('btn-prev-week').onclick = () => { reportMonday = addDays(reportMonday, -7); renderReport(); };
  $('btn-next-week').onclick = () => { reportMonday = addDays(reportMonday, 7); renderReport(); };
  $('btn-reset').onclick = () => {
    if (confirm('¿Borrar TODOS los jugadores y puntos de este dispositivo?')) {
      data = emptyData(); save(); renderReport(); renderPlayers();
    }
  };

  /* ---------- Historia y acertijo del día ---------- */
  // Cada día toca un par distinto (historia + acertijo que se resuelve con lo que leyeron).
  const DAILY = [
    { t: 'El truco de Gauss', s: 'Se cuenta que, de chico, Carl Gauss sumó los números del 1 al 10 en un instante. Juntó los extremos en parejas: 1+10, 2+9, 3+8, 4+7 y 5+6. ¡Todas las parejas dan 11!', q: 'Hay 5 parejas y cada una suma 11. ¿Cuánto es 5 × 11, o sea, 1+2+3+…+10?', a: 55 },
    { t: 'Las abejas y sus patas', s: 'Las abejas son insectos, y todos los insectos tienen 6 patas. Cuando una abeja se posa en una flor, usa sus patitas para juntar el polen.', q: 'En una flor hay 7 abejas. ¿Cuántas patas hay en total?', a: 42 },
    { t: 'El tablero de ajedrez', s: 'El tablero de ajedrez tiene 8 filas y en cada fila hay 8 casillas, alternando blancas y negras. Hace más de mil años que la gente juega en tableros como este.', q: '¿Cuántas casillas tiene un tablero de ajedrez? (8 × 8)', a: 64 },
    { t: 'La araña tejedora', s: 'La araña no es un insecto: tiene 8 patas, no 6. Con ellas teje su tela, hilo por hilo, y la usa para atrapar moscas.', q: 'En el jardín hay 7 arañas. ¿Cuántas patas tienen entre todas?', a: 56 },
    { t: 'Por qué la hora tiene 60 minutos', s: 'Hace mucho tiempo, en Babilonia, contaban de a 60. Por eso el reloj tiene 12 números y entre un número y el siguiente pasan 5 minutos.', q: 'El reloj tiene 12 números y entre cada uno pasan 5 minutos. ¿Cuántos minutos tarda en dar una vuelta completa?', a: 60 },
    { t: 'El cubo que da vueltas', s: 'El cubo de Rubik tiene 6 caras, cada una de un color. En cada cara hay 3 filas de 3 cuadraditos, o sea 9 cuadraditos por cara.', q: '¿Cuántos cuadraditos de color tiene el cubo en total? (6 × 9)', a: 54 },
    { t: 'El truco mágico del 9', s: 'Los resultados de la tabla del 9 guardan un secreto: sumá sus cifras y siempre te da 9. Mirá: 9 × 3 = 27 y 2 + 7 = 9. ¡Probalo con otros!', q: '¿Cuánto es 9 × 8? (Comprobá que sus cifras suman 9)', a: 72 },
    { t: 'Contar con los dedos', s: 'Contamos de a 10 porque tenemos 10 dedos en las manos. Mucho antes de las calculadoras, la gente multiplicaba y sumaba usando los dedos.', q: 'En la plaza hay 7 amigos levantando las manos. ¿Cuántos dedos hay en total?', a: 70 },
    { t: 'La docena', s: 'Una docena son 12 cosas. Se usa mucho para vender huevos, medialunas o empanadas. Por ejemplo, media docena son 6.', q: 'Mamá compró 4 docenas de empanadas. ¿Cuántas empanadas son?', a: 48 },
    { t: 'La pizza compartida', s: 'Una pizza grande suele cortarse en 8 porciones. Si todos se llevan la misma cantidad, nadie se enoja y las cuentas son fáciles.', q: 'En una fiesta piden 5 pizzas. ¿Cuántas porciones hay en total?', a: 40 },
    { t: 'El trébol de la suerte', s: 'Los tréboles casi siempre tienen 3 hojas, pero a veces aparece uno con 4 hojas. Dicen que quien encuentra uno tiene suerte, aunque es muy difícil de ver.', q: 'Encontraste 9 tréboles de 4 hojas. ¿Cuántas hojas hay en total?', a: 36 },
    { t: 'Los dados', s: 'Un dado es un cubo y por eso tiene 6 caras. Cada cara tiene de 1 a 6 puntitos, y las caras opuestas siempre suman 7.', q: 'En una mesa hay 11 dados. ¿Cuántas caras hay en total?', a: 66 },
    { t: 'El equipo de fútbol', s: 'Un equipo de fútbol juega con 11 jugadores en la cancha: 10 jugadores de campo y 1 arquero. ¡Hay que ponerse de acuerdo entre todos!', q: 'En un torneo juegan 9 equipos. ¿Cuántos jugadores hay en total, contando 11 por equipo?', a: 99 },
    { t: 'El pulpo y sus brazos', s: 'El pulpo tiene 8 brazos llenos de ventosas, y con ellos puede agarrar cosas, caminar por el fondo del mar y hasta abrir frascos.', q: 'En el acuario hay 4 pulpos. ¿Cuántos brazos tienen entre todos?', a: 32 },
    { t: 'La semana tiene 7 días', s: 'Lunes, martes, miércoles, jueves, viernes, sábado y domingo: la semana tiene 7 días. Los días de la semana se repiten una y otra vez, como una tabla de multiplicar.', q: 'Faltan 9 semanas para las vacaciones. ¿Cuántos días son?', a: 63 }
  ];
  // Adivinanzas "¿Qué número soy?" (una por día, distinta rotación que el acertijo)
  const ADIVI = [
    { q: 'Soy redondo como una pelota. Si me ponés a la derecha de otro número lo hago diez veces más grande, pero solo, no valgo nada. ¿Qué número soy?', a: 0 },
    { q: 'Soy el primero de todos cuando se cuenta y el más chiquito de los que contás. ¿Qué número soy?', a: 1 },
    { q: 'Estoy entre el uno y el tres. Si me sumás conmigo mismo, me convierto en cuatro. ¿Qué número soy?', a: 2 },
    { q: 'Parezco dos ruedas, una arriba de la otra. Si me acostás, me parezco al signo del infinito. ¿Qué número soy?', a: 8 },
    { q: 'Soy la cantidad de patas que tiene una hormiga. ¿Qué número soy?', a: 6 },
    { q: 'Soy una docena: con mis cosas se cuentan los meses del año y los números del reloj. ¿Qué número soy?', a: 12 },
    { q: 'Si me multiplicás por mí mismo, te doy 25. ¿Qué número soy?', a: 5 },
    { q: 'Un gusano está en el fondo de un pozo de 12 metros. Cada día sube 4 metros y cada noche resbala 1. ¿En cuántos días logra salir?', a: 4 },
    { q: 'Si me sumás 5, llegás a 20. ¿Qué número soy?', a: 15 },
    { q: 'Soy el doble de 7. ¿Qué número soy?', a: 14 },
    { q: 'Soy el resultado de 7 × 7. ¿Qué número soy?', a: 49 },
    { q: 'Me escribo igual al derecho que al revés, y soy la cantidad de jugadores de un equipo de fútbol. ¿Qué número soy?', a: 11 },
    { q: 'Soy un número par y estoy justo entre el 9 y el 11. ¿Qué número soy?', a: 10 },
    { q: 'Soy el triple de 9. ¿Qué número soy?', a: 27 },
    { q: 'Soy la mitad de 100. ¿Qué número soy?', a: 50 }
  ];
  const MAX_TRIES = 3;
  function dayNumber() {
    const n = new Date();
    return Math.floor(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / 86400000);
  }
  const todayItem = () => DAILY[dayNumber() % DAILY.length];
  const todayAdivi = () => ADIVI[(dayNumber() + 7) % ADIVI.length];

  // Un "juego diario" (acertijo o adivinanza): comparte la misma mecánica, cambia el contenido y los puntos.
  function dailyGame(o) {
    const $q = $(o.prefix + '-q'), $a = $(o.prefix + '-answer'), $b = $(o.prefix + '-btn'), $fb = $(o.prefix + '-fb');
    const state = name => { const d = data[o.store][ymd(new Date())]; return (d && d[name]) || { t: 0, ok: false }; };
    function update(wrong) {
      const name = $('riddle-player').value;
      const off = v => { $a.disabled = v; $b.disabled = v; };
      if (!name) { off(true); $fb.className = 'feedback'; $fb.textContent = 'Agregá un jugador para poder responder 👆'; return; }
      const st = state(name);
      if (st.ok) { off(true); $fb.className = 'feedback good'; $fb.textContent = '¡Ya lo resolviste hoy! +' + o.points + (o.points === 1 ? ' punto' : ' puntos') + ' ⭐'; return; }
      if (st.t >= MAX_TRIES) { off(true); $fb.className = 'feedback bad'; $fb.textContent = 'La respuesta era ' + o.item().a + '. ¡Mañana hay otra!'; return; }
      off(false);
      const left = MAX_TRIES - st.t;
      $fb.className = 'feedback' + (wrong ? ' bad' : '');
      $fb.textContent = (wrong ? 'Todavía no, ¡probá de nuevo! ' : '') + 'Te ' + (left === 1 ? 'queda 1 intento' : 'quedan ' + left + ' intentos') + '.';
    }
    $(o.prefix + '-form').addEventListener('submit', e => {
      e.preventDefault();
      const name = $('riddle-player').value;
      if (!name || $a.value === '') return;
      const st = state(name);
      if (st.ok || st.t >= MAX_TRIES) return;
      st.t++;
      const good = +$a.value === o.item().a;
      if (good) { st.ok = true; addPoints(name, o.points); }
      const day = ymd(new Date());
      data[o.store][day] = data[o.store][day] || {};
      data[o.store][day][name] = st;
      save();
      $a.value = '';
      update(!good);
    });
    return { render() { $q.textContent = o.item().q; update(); }, update };
  }
  const riddleGame = dailyGame({ prefix: 'riddle', store: 'riddles', points: 2, item: () => ({ q: todayItem().q, a: todayItem().a }) });
  const adiviGame = dailyGame({ prefix: 'adivi', store: 'adivi', points: 1, item: todayAdivi });

  function renderDaily() {
    const item = todayItem();
    $('story-title').textContent = item.t;
    $('story-text').textContent = item.s;
    const sel = $('riddle-player'), prev = sel.value;
    const names = Object.keys(data.players);
    sel.innerHTML = names.map(n => '<option value="' + esc(n) + '">' + esc(n) + '</option>').join('');
    if (names.includes(prev)) sel.value = prev;
    riddleGame.render();
    adiviGame.render();
  }
  $('riddle-player').onchange = () => {
    $('riddle-answer').value = ''; $('adivi-answer').value = '';
    riddleGame.update(); adiviGame.update();
  };

  /* ---------- Instalar como app (PWA) ---------- */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let installEvent = null;
  if (!isStandalone) {
    if (isIOS) {
      $('install-box').classList.remove('hidden');
      $('ios-help').classList.remove('hidden');
    }
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      installEvent = e;
      $('install-box').classList.remove('hidden');
      $('btn-install').classList.remove('hidden');
    });
    window.addEventListener('appinstalled', () => $('install-box').classList.add('hidden'));
  }
  $('btn-install').onclick = async () => {
    if (!installEvent) return;
    installEvent.prompt();
    await installEvent.userChoice;
    installEvent = null;
    $('install-box').classList.add('hidden');
  };

  renderPlayers();
  show('home');
})();
</script>
</body>
</html>
